[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dspyui"
dynamic = ["version"]
description = "A Gradio user interface for DSPy: define a signature, add data, optimize the prompt and test it, without writing code."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.15"
authors = [{ name = "Mike Taylor" }]
keywords = ["dspy", "gradio", "prompt-optimization", "context-engineering", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Gradio 5 is pinned on purpose: Gradio 6 renders the interface differently.
    "gradio>=5.50.0,<6",
    # 3.3.0 is the version the book pins; tested against 3.4.0.
    "dspy>=3.3.0",
    # MIPROv2 needs optuna, which DSPy only installs as an optional extra.
    "optuna>=3.4.0",
    "pandas>=2.0.0",
    "numpy>=1.26",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.18.0", "types-requests>=2.32.0"]

[project.scripts]
dspyui = "dspyui.cli:main"

[project.urls]
Homepage = "https://github.com/hammer-mt/DSPyUI"
Repository = "https://github.com/hammer-mt/DSPyUI"
Issues = "https://github.com/hammer-mt/DSPyUI/issues"

[tool.hatch.version]
path = "dspyui/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["dspyui"]

[tool.hatch.build.targets.sdist]
include = [
    "/dspyui",
    "/tests",
    "/interface.py",
    "/app.py",
    "/webui.sh",
    "/requirements.txt",
    "/README.md",
    "/README_SPACES.md",
    "/LICENSE",
    "/.env.example",
]
