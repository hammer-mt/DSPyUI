# Publishes DSPyUI to PyPI as "dspyui-gradio" (https://pypi.org/project/dspyui-gradio/).
#
# Uses PyPI "Trusted Publishing": PyPI is configured to accept uploads from this
# workflow in this repository, so no API token or password is stored anywhere.
#
# To release a new version:
#   1. Change __version__ in dspyui/__init__.py and push to main.
#   2. Publish a GitHub release (or run this workflow by hand from the Actions tab).
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the offline unit tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          python -m pytest tests/test_core.py
      - name: Build the sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # lets PyPI verify that the upload comes from this workflow
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
